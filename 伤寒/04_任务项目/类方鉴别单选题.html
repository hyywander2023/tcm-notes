<script>
const QUESTIONS = [
  {group:"一、桂枝汤族", stem:"桂枝汤原方中桂枝与芍药的用量是：",
   options:["桂枝三两、芍药三两","桂枝三两、芍药六两","桂枝二两、芍药三两","桂枝四两、芍药二两"], answer:0,
   explain:"12 条方后：「桂枝三两（去皮）、芍药三两、甘草二两（炙）、生姜三两（切）、大枣十二枚（擘）。」桂芍等量，一散一收，调和营卫。后世桂枝加芍药汤才是芍药六两。"},

  {group:"一、桂枝汤族", stem:"「项背强几几，反汗出恶风者」，治宜：",
   options:["葛根汤","桂枝加葛根汤","桂枝汤","麻黄汤"], answer:1,
   explain:"14 条：「太阳病，项背强几几，反汗出恶风者，桂枝加葛根汤主之。」一个「反」字点出本该无汗而反汗出，故属桂枝汤证加葛根，而非葛根汤。"},

  {group:"一、桂枝汤族", stem:"宋本葛根汤与桂枝加葛根汤在组成上的关键差别是：",
   options:["葛根汤用麻黄，桂枝加葛根汤不用麻黄","葛根汤不用芍药","桂枝加葛根汤用栝楼根","葛根汤用人参"], answer:0,
   explain:"31 条葛根汤：葛根四两、麻黄三两、桂枝二两、芍药二两、甘草二两、生姜三两、大枣十二枚；14 条桂枝加葛根汤有葛根而无麻黄。有汗无汗是分水岭。"},

  {group:"一、桂枝汤族", stem:"「发汗后，身疼痛，脉沉迟者」，治宜：",
   options:["桂枝加附子汤","桂枝加芍药生姜各一两人参三两新加汤","附子汤","芍药甘草附子汤"], answer:1,
   explain:"62 条：「发汗后，身疼痛，脉沉迟者，桂枝加芍药生姜各一两人参三两新加汤主之。」汗后营气不足、筋脉失养，故身痛而脉沉迟，与表证身痛脉浮不同。"},

  {group:"一、桂枝汤族", stem:"桂枝新加汤是在桂枝汤基础上的何种变化？",
   options:["加人参三两，芍药、生姜各加一两","加附子一枚","加黄芪三两","加当归三两"], answer:0,
   explain:"方名即组成：桂枝汤原方，芍药、生姜各加一两，再加人参三两。重在益气和营，而非温阳（故不用附子）。"},

  {group:"一、桂枝汤族", stem:"「发汗，遂漏不止，其人恶风，小便难，四肢微急，难以屈伸者」，治宜：",
   options:["桂枝加附子汤","桂枝去芍药加附子汤","四逆汤","真武汤"], answer:0,
   explain:"20 条：「……桂枝加附子汤主之。」汗漏不止、阳虚液脱，故用附子温经复阳、固表止汗。与 22 条桂枝去芍药加附子汤之「脉促胸满兼微恶寒」病位不同。"},

  {group:"一、桂枝汤族", stem:"「太阳病，下之后，脉促胸满者」，若更见「微恶寒」，治宜：",
   options:["桂枝去芍药汤","桂枝去芍药加附子汤","桂枝加附子汤","桂枝甘草汤"], answer:1,
   explain:"21 条脉促胸满用桂枝去芍药汤（芍药酸敛，不利于胸阳舒展）；22 条「若微恶寒者，桂枝去芍药方中加附子汤主之」，是兼阳虚，故再加附子。"},

  {group:"一、桂枝汤族", stem:"「服桂枝汤，大汗出，脉洪大者，与桂枝汤如前法；若形似疟，一日再发者」，治宜：",
   options:["桂枝麻黄各半汤","桂枝二麻黄一汤","桂枝二越婢一汤","麻黄汤"], answer:1,
   explain:"25 条：「……宜桂枝二麻黄一汤。」一日再发，邪比 23 条各半汤证更轻，故麻黄只用十六铢，取微汗而已。"},

  {group:"一、桂枝汤族", stem:"「发汗过多，其人叉手自冒心，心下悸，欲得按者」，治宜：",
   options:["桂枝甘草汤","桂枝加桂汤","茯苓桂枝甘草大枣汤","炙甘草汤"], answer:0,
   explain:"64 条：「……桂枝甘草汤主之。」汗多心阳虚，病人叉手按心以求护。桂枝四两、甘草二两，辛甘化阳，是温补心阳最简之方。"},

  {group:"一、桂枝汤族", stem:"「烧针令其汗，针处被寒，核起而赤者，必发奔豚，气从少腹上冲心者」，治宜：",
   options:["茯苓桂枝甘草大枣汤","桂枝加桂汤","桂枝甘草汤","茯苓桂枝白术甘草汤"], answer:1,
   explain:"117 条：「……与桂枝加桂汤，更加桂二两也。」奔豚已发、气从少腹上冲心，用桂枝五两平冲降逆。若仅是「脐下悸，欲作奔豚」（65 条），则用苓桂枣甘汤。"},

  {group:"一、桂枝汤族", stem:"茯苓桂枝甘草大枣汤的煎法特点是：",
   options:["用甘澜水","用清酒","用麻沸汤","用苦酒"], answer:0,
   explain:"65 条方后：「……以甘澜水一斗，先煮茯苓，减二升……作甘澜水法：取水二斗，置大盆内，以杓扬之，水上有珠子五六千颗相逐，取用之。」取其轻扬而不助水邪。"},

  {group:"二、麻黄汤族", stem:"麻黄汤中麻黄与桂枝的用量比是：",
   options:["3:2","2:3","1:1","4:3"], answer:0,
   explain:"35 条方：麻黄三两、桂枝二两、甘草一两、杏仁七十个。麻黄为君发汗，桂枝助其发散，故麻黄重于桂枝。"},

  {group:"二、麻黄汤族", stem:"大青龙汤中麻黄的用量是：",
   options:["三两","四两","六两","半斤"], answer:2,
   explain:"38 条方：麻黄六两、桂枝二两、甘草二两、杏仁四十枚、生姜三两、大枣十枚、石膏如鸡子大。麻黄六两为全书最重，故属发汗峻剂，方后特嘱「取微似汗」。"},

  {group:"二、麻黄汤族", stem:"「脉浮紧，发热恶寒，身疼痛，不汗出而烦躁者」，治宜：",
   options:["麻黄汤","大青龙汤","麻黄杏仁甘草石膏汤","小青龙汤"], answer:1,
   explain:"38 条：「太阳中风，脉浮紧，发热恶寒，身疼痛，不汗出而烦躁者，大青龙汤主之。」「不汗出而烦躁」是表寒里热的眼目——无汗说明表闭，烦躁说明里有郁热。"},

  {group:"二、麻黄汤族", stem:"「发汗后，不可更行桂枝汤，汗出而喘，无大热者」，治宜：",
   options:["麻黄汤","大青龙汤","麻黄杏仁甘草石膏汤","桂枝加厚朴杏子汤"], answer:2,
   explain:"63 条：「……可与麻黄杏仁甘草石膏汤。」汗出而喘、无大热，是热壅于肺而非表实。麻黄四两配石膏半斤，一宣一清。与 43 条「下之微喘、表未解」用桂枝加厚朴杏子汤正相对。"},

  {group:"二、麻黄汤族", stem:"小青龙汤证「或渴」的加减是：",
   options:["去半夏，加栝楼根三两","加石膏二两","去麻黄，加杏仁","加人参三两"], answer:0,
   explain:"40 条方后：「若渴，去半夏，加栝楼根三两。」半夏燥湿，渴则去之；栝楼根生津止渴。其余加减：噎去麻黄加附子，小便不利少腹满去麻黄加茯苓，喘去麻黄加杏仁。"},

  {group:"二、麻黄汤族", stem:"麻黄细辛附子汤与麻黄附子甘草汤的主要区别是：",
   options:["前者用细辛，后者用甘草；前者证情较急","前者用甘草，后者用细辛","前者无人参，后者有人参","前者用附子二枚，后者一枚"], answer:0,
   explain:"301 条「始得之，反发热，脉沉者」病势急，用细辛通达表里；302 条「得之二三日，麻黄附子甘草汤微发汗，以二三日无证」，病势缓，去细辛之峻，加甘草之缓。"},

  {group:"三、柴胡汤族", stem:"小柴胡汤中柴胡的用量是：",
   options:["三两","半斤","一斤","二两"], answer:1,
   explain:"96 条方：柴胡半斤（即八两）、黄芩三两、人参三两、甘草三两、半夏半升、生姜三两、大枣十二枚。柴胡用量为全书方中较重者，取其透达少阳。"},

  {group:"三、柴胡汤族", stem:"大柴胡汤较小柴胡汤的化裁是：",
   options:["去人参、甘草，加芍药、枳实、大黄","去半夏，加栝楼根","加芒硝二两","去黄芩，加桂枝"], answer:0,
   explain:"大柴胡汤：柴胡半斤、黄芩三两、芍药三两、半夏半升、生姜五两、枳实四枚、大枣十二枚、大黄二两。去人参、甘草之补，加芍药、枳实、大黄以通里实。"},

  {group:"三、柴胡汤族", stem:"「呕不止，心下急，郁郁微烦者」，治宜：",
   options:["小柴胡汤","大柴胡汤","柴胡加芒硝汤","柴胡桂枝汤"], answer:1,
   explain:"103 条：「太阳病，过经十余日，反二三下之，后四五日，柴胡证仍在者，先与小柴胡；呕不止，心下急，郁郁微烦者，为未解也，与大柴胡汤，下之则愈。」少阳兼里实。"},

  {group:"三、柴胡汤族", stem:"柴胡桂枝汤的构成是：",
   options:["小柴胡汤与桂枝汤各取半量合方","小柴胡汤原量加桂枝三两","桂枝汤加柴胡、黄芩","大柴胡汤加桂枝"], answer:0,
   explain:"146 条方：柴胡四两、桂枝一两半、黄芩一两半、人参一两半、甘草一两、半夏二合半、芍药一两半、大枣六枚、生姜一两半，正是两方各取半量。治「发热微恶寒，支节烦疼，微呕，心下支结」。"},

  {group:"三、柴胡汤族", stem:"「胸胁满微结，小便不利，渴而不呕，但头汗出，往来寒热，心烦者」，治宜：",
   options:["柴胡桂枝汤","柴胡桂枝干姜汤","大柴胡汤","五苓散"], answer:1,
   explain:"147 条：「……此为未解也，柴胡桂枝干姜汤主之。」胆热脾寒、水饮内结。渴而不呕、但头汗出、小便不利，是本方三眼目。"},

  {group:"三、柴胡汤族", stem:"柴胡桂枝干姜汤中不含下列哪味药？",
   options:["栝楼根","牡蛎","半夏","干姜"], answer:2,
   explain:"147 条方：柴胡半斤、桂枝三两、干姜二两、栝楼根四两、黄芩三两、牡蛎二两、甘草二两。无半夏、人参、大枣——因不呕，故不用半夏。"},

  {group:"三、柴胡汤族", stem:"「胸满烦惊，小便不利，谵语，一身尽重，不可转侧者」，治宜：",
   options:["柴胡加龙骨牡蛎汤","柴胡桂枝汤","桂枝甘草龙骨牡蛎汤","大承气汤"], answer:0,
   explain:"107 条：「伤寒八九日，下之，胸满烦惊，小便不利，谵语，一身尽重，不可转侧者，柴胡加龙骨牡蛎汤主之。」方中柴、芩和解少阳，龙、牡、铅丹重镇安神，大黄泄热，茯苓利水。"},

  {group:"四、承气、陷胸与下法", stem:"大承气汤中用量最重的是：",
   options:["大黄","厚朴","枳实","芒硝"], answer:1,
   explain:"208 条方：大黄四两、厚朴半斤、枳实五枚、芒硝三合。厚朴半斤为诸药之最，重在行气除满，故本方以「痞满燥实坚」之「满」为要。"},

  {group:"四、承气、陷胸与下法", stem:"调胃承气汤区别于大、小承气汤的关键是：",
   options:["有甘草而无枳实、厚朴","有芒硝而不用大黄","大黄用量最大","有厚朴而无枳实"], answer:0,
   explain:"调胃承气汤：大黄四两、甘草二两、芒硝半升。无枳实、厚朴，故不主痞满；有甘草，故能和中缓急，治「蒸蒸发热、心烦、大便不通」之燥实而无痞满者。"},

  {group:"四、承气、陷胸与下法", stem:"小承气汤试探燥屎的指征是：",
   options:["汤入腹中，转失气","服后下利","腹中雷鸣","服后汗出"], answer:0,
   explain:"209 条：「若不大便六七日，恐有燥屎，欲知之法，少与小承气汤，汤入腹中，转失气者，此有燥屎，乃可攻之；若不转失气者，此但初头硬，后必溏，不可攻之。」"},

  {group:"四、承气、陷胸与下法", stem:"「热结膀胱，其人如狂，血自下，下者愈……少腹急结者」，治宜：",
   options:["桃核承气汤","抵当汤","大承气汤","小承气汤"], answer:0,
   explain:"106 条：「……但少腹急结者，乃可攻之，宜桃核承气汤。」蓄血轻证，先解表，表解乃可攻之。方含桃仁、大黄、桂枝、甘草、芒硝。"},

  {group:"四、承气、陷胸与下法", stem:"抵当汤与抵当丸的正确区别是：",
   options:["汤证势急，丸证势缓，故水蛭、虻虫减量","丸证势急，汤证势缓","两方组成完全相同","抵当丸无大黄"], answer:0,
   explain:"抵当汤：水蛭三十个、虻虫三十个、桃仁二十个、大黄三两；抵当丸：水蛭二十个、虻虫二十个、桃仁二十五个、大黄三两，捣分四丸，煮一丸。丸者缓攻，治「伤寒有热，少腹满……为有血也」。"},

  {group:"四、承气、陷胸与下法", stem:"大陷胸汤的组成是：",
   options:["大黄、芒硝、甘遂","大黄、芒硝、葶苈子、杏仁","黄连、半夏、栝楼实","甘遂、芫花、大戟"], answer:0,
   explain:"134 条方：大黄六两、芒硝一升、甘遂一钱匕。水热互结之结胸，非大陷胸汤不能破；大黄芒硝葶苈杏仁属大陷胸丸，黄连半夏栝楼实属小陷胸汤，甘遂芫花大戟属十枣汤。"},

  {group:"四、承气、陷胸与下法", stem:"「结胸者，项亦强，如柔痉状」，治宜：",
   options:["大陷胸汤","大陷胸丸","小陷胸汤","葛根汤"], answer:1,
   explain:"131 条：「结胸者，项亦强，如柔痉状，下之则和，宜大陷胸丸。」病位偏上，故用丸剂峻药缓攻，方中加葶苈子、杏仁泻肺，白蜜缓和。"},

  {group:"四、承气、陷胸与下法", stem:"「正在心下，按之则痛，脉浮滑者」，治宜：",
   options:["大陷胸汤","小陷胸汤","半夏泻心汤","大承气汤"], answer:1,
   explain:"138 条：「小结胸病，正在心下，按之则痛，脉浮滑者，小陷胸汤主之。」黄连一两、半夏半升、栝楼实一枚。与大陷胸汤「心下痛，按之石硬，脉沉紧」相比，一轻一重，一痰热一水热。"},

  {group:"四、承气、陷胸与下法", stem:"十枣汤的服法是：",
   options:["平旦温服，得快下利后糜粥自养","临卧顿服","分温三服","少少含咽"], answer:0,
   explain:"152 条方后：「……平旦温服之，不下者，明日更加半钱，得快下后，糜粥自养。」芫花、甘遂、大戟等分，以大枣十枚煎汤送服，强人一钱匕，羸人半钱匕。"},

  {group:"四、承气、陷胸与下法", stem:"三物白散主治：",
   options:["寒实结胸","热实结胸","痰热结胸","悬饮"], answer:0,
   explain:"141 条：「寒实结胸，无热证者，与三物小陷胸汤，白散亦可服。」白散即桔梗三分、巴豆一分、贝母三分。方后注「不利，进热粥一杯；利过不止，进冷粥一杯」，以粥之冷热调药力。"},

  {group:"五、泻心与痞证", stem:"「但满而不痛者，此为痞」，治宜：",
   options:["半夏泻心汤","大陷胸汤","黄连汤","厚朴生姜半夏甘草人参汤"], answer:0,
   explain:"149 条：「……但满而不痛者，此为痞，柴胡不中与之，宜半夏泻心汤。」痞为无形邪气结于中焦，故但满不痛；结胸则硬满而痛。"},

  {group:"五、泻心与痞证", stem:"生姜泻心汤与半夏泻心汤的差别是：",
   options:["减干姜二两，加生姜四两","加生姜三两，去干姜","加生姜，去人参","加生姜、附子"], answer:0,
   explain:"157 条生姜泻心汤即半夏泻心汤减干姜二两、加生姜四两。水气偏重，故重用生姜散水，干姜减量以免助燥。主症「干噫食臭，胁下有水气，腹中雷鸣下利」。"},

  {group:"五、泻心与痞证", stem:"甘草泻心汤在宋本中无人参，多认为是：",
   options:["脱落","有意不用","以甘草代人参","以干姜代人参"], answer:0,
   explain:"158 条方后林亿等注：「恐是脱简。」《金匮要略》同名方有人参三两，且本方所治「下利日数十行、谷不化」正是胃虚之极，非人参不能补，故通行看法为脱文。"},

  {group:"五、泻心与痞证", stem:"大黄黄连泻心汤的煎法是：",
   options:["麻沸汤渍之，须臾绞去滓","水煎顿服","酒煎","蜜煎"], answer:0,
   explain:"154 条方后：「上二味，以麻沸汤二升渍之，须臾绞去滓，分温再服。」不煎而渍，取其气薄轻扬，走上焦以泄热，不欲其味厚下行。"},

  {group:"五、泻心与痞证", stem:"附子泻心汤中附子的用法是：",
   options:["别煮取汁，与三黄渍汁合服","与三黄同煎","炮后研末冲服","先煎"], answer:0,
   explain:"155 条方后：「上四味，切三味，以麻沸汤二升渍之，须臾绞去滓，内附子汁，分温再服。」三黄渍取气，附子煮取味，寒热异气、生熟异性，各走其道。"},

  {group:"五、泻心与痞证", stem:"黄连汤与半夏泻心汤的差别是：",
   options:["去黄芩，加桂枝，重用黄连","去黄连，加桂枝","加桂枝、附子","减甘草，加生姜"], answer:0,
   explain:"173 条方：黄连三两、甘草三两、干姜三两、桂枝三两、人参二两、半夏半升、大枣十二枚。去黄芩之清中，加桂枝以通阳，黄连重用至三两，治「胸中有热，胃中有邪气，腹中痛，欲呕吐」。"},

  {group:"五、泻心与痞证", stem:"「食入口即吐」者，治宜：",
   options:["干姜黄芩黄连人参汤","黄连汤","吴茱萸汤","半夏泻心汤"], answer:0,
   explain:"359 条：「伤寒本自寒下，医复吐下之，寒格，更逆吐下，若食入口即吐，干姜黄芩黄连人参汤主之。」寒格于下、热格于上，故食入即吐，与「朝食暮吐」之胃反不同。"},

  {group:"五、泻心与痞证", stem:"「心下痞硬，噫气不除者」，治宜：",
   options:["旋复代赭汤","生姜泻心汤","半夏泻心汤","厚朴生姜半夏甘草人参汤"], answer:0,
   explain:"161 条：「伤寒发汗若吐若下，解后，心下痞硬，噫气不除者，旋复代赭汤主之。」与生姜泻心汤「干噫食臭」不同：彼有水气下利，此则胃虚气逆、噫而无食臭。"},

  {group:"六、四逆与附子族", stem:"四逆汤的组成是：",
   options:["生附子一枚、干姜一两半、甘草二两","炮附子一枚、干姜三两、甘草二两","生附子二枚、干姜一两、甘草二两","附子一枚、人参一两、干姜一两半"], answer:0,
   explain:"29 条方：甘草二两（炙）、干姜一两半、附子一枚（生用，去皮，破八片）。注意是生附子，且干姜仅一两半——通脉四逆汤才是干姜三两、大附子一枚。"},

  {group:"六、四逆与附子族", stem:"通脉四逆汤与四逆汤的用量差别是：",
   options:["干姜增至三两，用大附子一枚","附子增至二枚，干姜减为一两","加人参一两","加葱白四茎"], answer:0,
   explain:"317 条方：甘草二两、附子大者一枚（生用）、干姜三两（强人可四两）。药味与四逆汤完全相同，全在剂量——故名「通脉」。"},

  {group:"六、四逆与附子族", stem:"「下利清谷，里寒外热，手足厥逆，脉微欲绝，身反不恶寒，其人面色赤」，治宜：",
   options:["四逆汤","通脉四逆汤","白通汤","四逆加人参汤"], answer:1,
   explain:"317 条：「少阴病，下利清谷，里寒外热，手足厥逆，脉微欲绝，身反不恶寒，其人面色赤，或腹痛，或干呕，或咽痛，或利止脉不出者，通脉四逆汤主之。」阴盛格阳，虚阳浮越。"},

  {group:"六、四逆与附子族", stem:"通脉四逆汤方后注「面色赤者」，加：",
   options:["葱九茎","人参","猪胆汁","桂枝"], answer:0,
   explain:"317 条方后：「面色赤者，加葱九茎。」葱白通阳，引虚阳下行。另有「腹中痛者去葱加芍药二两」「呕者加生姜二两」「咽痛者去芍药加桔梗一两」「利止脉不出者去桔梗加人参二两」。"},

  {group:"六、四逆与附子族", stem:"白通汤的组成是：",
   options:["葱白四茎、干姜一两、生附子一枚","葱白四茎、干姜三两、甘草二两","葱白、人参、附子","葱白、猪胆汁、人尿"], answer:0,
   explain:"314 条方：葱白四茎、干姜一两、附子一枚（生用）。不用甘草，因甘草缓滞，不利于破阴回阳；用葱白通上下之阳。与通脉四逆汤之「面赤」相比，白通汤侧重下利、脉微。"},

  {group:"六、四逆与附子族", stem:"白通加猪胆汁汤中加入人尿、猪胆汁的用意是：",
   options:["苦咸寒反佐，引阳药入阴，破其格拒","增强温阳散寒","滋阴清热除烦","制约姜附燥烈"], answer:0,
   explain:"315 条：服白通汤后「利不止，厥逆无脉，干呕，烦者」，是阴寒格拒热药。加人尿五合、猪胆汁一合作反佐，取「甚者从之」之意，使药能受纳。"},

  {group:"六、四逆与附子族", stem:"「恶寒脉微而复利，利止，亡血也」，治宜：",
   options:["四逆加人参汤","四逆汤","通脉四逆汤","茯苓四逆汤"], answer:0,
   explain:"385 条：「恶寒脉微而复利，利止，亡血也，四逆加人参汤主之。」利止并非病愈，而是津血已竭、无物可下，故于四逆汤中加人参益气生津。"},

  {group:"六、四逆与附子族", stem:"茯苓四逆汤的组成是：",
   options:["四逆汤加茯苓、人参","四逆汤加茯苓、白术","四逆汤加人参、白术","四逆汤加茯苓、桂枝"], answer:0,
   explain:"69 条方：茯苓四两、人参一两、附子一枚（生用）、甘草二两、干姜一两半。治「发汗若下之，病仍不解，烦躁者」，属阴阳俱虚、水火不交。"},

  {group:"六、四逆与附子族", stem:"「昼日烦躁不得眠，夜而安静，不呕不渴，无表证，脉沉微，身无大热者」，治宜：",
   options:["干姜附子汤","茯苓四逆汤","四逆汤","栀子豉汤"], answer:0,
   explain:"61 条：「下之后，复发汗，昼日烦躁不得眠，夜而安静，不呕不渴，无表证，脉沉微，身无大热者，干姜附子汤主之。」白日阳气得天时之助尚能与阴争，故烦；夜间阳气更衰，反安静。属阳气暴虚。"},

  {group:"六、四逆与附子族", stem:"附子汤与真武汤在组成上的关键差别是：",
   options:["附子汤有参、术（四两）而无生姜；真武汤有生姜而无参","附子汤有生姜而无人参","真武汤有甘草","两方组成完全相同"], answer:0,
   explain:"附子汤：附子二枚、茯苓三两、人参二两、白术四两、芍药三两；真武汤：附子一枚、茯苓三两、白术二两、芍药三两、生姜三两。一补一利，人参、生姜之有无是分水岭，两方皆无甘草。"},

  {group:"六、四逆与附子族", stem:"附子汤证「口中和」的意义是：",
   options:["里无热象，可与阳明热证相鉴别","口苦咽干","口渴喜饮","口淡属脾虚"], answer:0,
   explain:"304 条：「少阴病，得之一二日，口中和，其背恶寒者，当灸之，附子汤主之。」「口中和」指口中不苦不燥不渴，说明里无热，正与白虎加人参汤「口燥渴、背微恶寒」相对。"},

  {group:"六、四逆与附子族", stem:"「太阳病发汗，汗出不解，其人仍发热，心下悸，头眩，身瞤动，振振欲擗地者」，治宜：",
   options:["真武汤","附子汤","苓桂术甘汤","五苓散"], answer:0,
   explain:"82 条：「……真武汤主之。」阳虚不能制水，水气上凌则悸眩，外溢筋脉则瞤动。此条「仍发热」是虚阳外浮，非表证未解，最易误作桂枝证。"},

  {group:"七、水饮族", stem:"五苓散中用量最重的是：",
   options:["泽泻","猪苓","茯苓","桂枝"], answer:0,
   explain:"71 条方：猪苓十八铢、泽泻一两六铢、白术十八铢、茯苓十八铢、桂枝半两。泽泻一两六铢（三十铢）为诸药之最，桂枝仅半两，取其化气行水而非解表。"},

  {group:"七、水饮族", stem:"「渴欲饮水，水入则吐」，称为：",
   options:["水逆","水厥","结胸","蓄血"], answer:0,
   explain:"74 条：「中风发热，六七日不解而烦，有表里证，渴欲饮水，水入则吐者，名曰水逆，五苓散主之。」膀胱气化不利，水停下焦，饮入之水不得下行而上逆。"},

  {group:"七、水饮族", stem:"猪苓汤中不含：",
   options:["桂枝、白术","泽泻","滑石","阿胶"], answer:0,
   explain:"223 条方：猪苓、茯苓、泽泻、滑石、阿胶各一两。无桂枝、白术，故不走温阳化气之路，而以淡渗利水、清热养阴为法。"},

  {group:"七、水饮族", stem:"「少阴病，下利六七日，咳而呕渴，心烦不得眠者」，治宜：",
   options:["猪苓汤","黄连阿胶汤","五苓散","真武汤"], answer:0,
   explain:"319 条：「……猪苓汤主之。」水热互结而阴伤，故见咳、呕、渴、心烦不得眠。与 303 条黄连阿胶汤之纯阴虚火旺不同：彼无下利咳呕、无水气。"},

  {group:"七、水饮族", stem:"「伤寒汗出而渴者，五苓散主之；不渴者」，治宜：",
   options:["茯苓甘草汤","苓桂术甘汤","真武汤","猪苓汤"], answer:0,
   explain:"73 条：「伤寒汗出而渴者，五苓散主之；不渴者，茯苓甘草汤主之。」一渴一不渴，是两方最简的鉴别点。茯苓甘草汤：茯苓二两、桂枝二两、甘草一两、生姜三两。"},

  {group:"八、栀子豉、白虎与发黄", stem:"栀子豉汤的主症是：",
   options:["虚烦不得眠，心中懊憹，反复颠倒","心中烦，不得卧","昼日烦躁不得眠","心烦腹满，卧起不安"], answer:0,
   explain:"76 条：「发汗吐下后，虚烦不得眠，若剧者，必反复颠倒，心中懊憹，栀子豉汤主之。」「虚烦」指无形邪热郁于胸膈，非虚证。「心中烦，不得卧」属黄连阿胶汤；「昼日烦躁」属干姜附子汤；「心烦腹满」属栀子厚朴汤。"},

  {group:"八、栀子豉、白虎与发黄", stem:"栀子豉汤证兼「少气」者，加：",
   options:["甘草","生姜","人参","大枣"], answer:0,
   explain:"76 条：「若少气者，栀子甘草豉汤主之；若呕者，栀子生姜豉汤主之。」甘草益气和中，生姜散饮止呕。一方一加，界限分明。"},

  {group:"八、栀子豉、白虎与发黄", stem:"「伤寒下后，心烦腹满，卧起不安者」，治宜：",
   options:["栀子厚朴汤","栀子干姜汤","栀子豉汤","小承气汤"], answer:0,
   explain:"79 条：「……栀子厚朴汤主之。」栀子十四个、厚朴四两、枳实四枚。热郁而兼气滞，故腹满；无大便硬、无潮热，故不用承气。"},

  {group:"八、栀子豉、白虎与发黄", stem:"「伤寒，医以丸药大下之，身热不去，微烦者」，治宜：",
   options:["栀子干姜汤","栀子厚朴汤","栀子豉汤","干姜附子汤"], answer:0,
   explain:"80 条：「……栀子干姜汤主之。」大下伤中阳，故用干姜温中；身热微烦，是上焦余热未清，故用栀子清上。寒热并用，属上热中寒。"},

const LETTERS = ["A", "B", "C", "D"];
const quizEl = document.getElementById("quiz");
const barFill = document.getElementById("barFill");
const doneNum = document.getElementById("doneNum");
const rightNum = document.getElementById("rightNum");
const totalNum = document.getElementById("totalNum");
const summaryEl = document.getElementById("summary");

let answered = 0;
let correct = 0;

function seededOrder(seed) {
  const a = [0, 1, 2, 3];
  let s = seed * 7919 + 104729;
  for (let i = a.length - 1; i > 0; i--) {
    s = (Math.imul(s, 1103515245) + 12345) & 0x7fffffff;
    const j = s % (i + 1);
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

totalNum.textContent = QUESTIONS.length;
document.getElementById("finalTotal").textContent = QUESTIONS.length;

function build() {
  quizEl.innerHTML = "";
  answered = 0;
  correct = 0;
  summaryEl.classList.remove("show");
  updateMeter();

  let lastGroup = "";

  QUESTIONS.forEach(function (q, qi) {
    if (q.group !== lastGroup) {
      const gh = document.createElement("div");
      gh.className = "group-head";
      const cnt = QUESTIONS.filter(function (x) { return x.group === q.group; }).length;
      gh.innerHTML = '<span class="g-name"></span><span class="g-cnt">' + cnt + ' 题</span>';
      gh.querySelector(".g-name").textContent = q.group;
      quizEl.appendChild(gh);
      lastGroup = q.group;
    }

    const section = document.createElement("section");
    section.className = "q";

    const head = document.createElement("div");
    head.className = "q-head";
    const no = document.createElement("div");
    no.className = "q-no";
    no.textContent = String(qi + 1).padStart(2, "0");
    const stem = document.createElement("p");
    stem.className = "q-stem";
    stem.textContent = q.stem;
    head.appendChild(no);
    head.appendChild(stem);
    section.appendChild(head);

    const opts = document.createElement("div");
    opts.className = "opts";

    const order = seededOrder(qi + 1);
    const explainEl2 = document.createElement("div");
    explainEl2.className = "explain";
    explainEl2.hidden = true;

    order.forEach(function (oi, pos) {
      const text = q.options[oi];
      const btn = document.createElement("button");
      btn.className = "opt";
      btn.type = "button";

      const key = document.createElement("span");
      key.className = "key";
      key.textContent = LETTERS[pos];

      const label = document.createElement("span");
      label.textContent = text;

      btn.appendChild(key);
      btn.appendChild(label);

      btn.addEventListener("click", function () {
        if (section.dataset.done === "1") return;
        section.dataset.done = "1";

        const buttons = opts.querySelectorAll(".opt");
        buttons.forEach(function (b) { b.disabled = true; });

        if (oi === q.answer) {
          btn.classList.add("correct");
          correct++;
        } else {
          btn.classList.add("wrong");
          buttons[order.indexOf(q.answer)].classList.add("correct");
        }

        answered++;
        updateMeter();
        explainEl2.hidden = false;
        if (answered === QUESTIONS.length) showSummary();
      });

      opts.appendChild(btn);
    });

    section.appendChild(opts);

    const tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = "解析";
    const quote = document.createElement("span");
    quote.className = "quote";
    quote.textContent = q.explain;
    explainEl2.appendChild(tag);
    explainEl2.appendChild(quote);
    section.appendChild(explainEl2);

    quizEl.appendChild(section);
  });
}

function updateMeter() {
  barFill.style.width = (answered / QUESTIONS.length * 100) + "%";
  doneNum.textContent = answered;
  rightNum.textContent = correct;
}

function showSummary() {
  document.getElementById("finalScore").textContent = correct;
  const verdict = document.getElementById("verdict");
  const hint = document.getElementById("hint");
  const rate = correct / QUESTIONS.length;

  if (rate >= 0.9) {
    verdict.textContent = "类方鉴别已经很扎实，组成、剂量、煎法都拎得清。";
    hint.textContent = "下一步可以挑战「原文填空」或「方证互辨」：只给一段病案，让你自己出方。";
  } else if (rate >= 0.75) {
    verdict.textContent = "主干立住了，个别相邻方还会串。";
    hint.textContent = "重点回看错题所属的方族，尤其是同根加减方的「多一味、少一味」和方后注里的煎服法。";
  } else if (rate >= 0.6) {
    verdict.textContent = "方向大体对，但族内层次还容易混。";
    hint.textContent = "建议先按「汗—渴—脉—按—利」五轴把方群过一遍，再重做一次。";
  } else {
    verdict.textContent = "先别急着背方，先把每个方族的「共同底方 + 加减逻辑」理出来。";
    hint.textContent = "回看五轴图与各方族的第一题，抓住每一族的鉴别主轴，正确率会很快上来。";
  }

  summaryEl.classList.add("show");
  summaryEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

document.getElementById("resetBtn").addEventListener("click", function () {
  build();
  window.scrollTo({ top: 0, behavior: "smooth" });
});

build();
</script>
